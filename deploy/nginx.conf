# Nginx for cloud.faidz.fun (spec §7.4).
#
# This server sees JSON and one redirect, never file bytes: uploads go straight
# from the browser to storage and downloads come straight back (decision D1).
# That is why client_max_body_size stays at a value that would be absurd for a
# photo host — there is no upload passing through here to be limited.

server {
    listen 80;
    listen [::]:80;
    server_name cloud.faidz.fun;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.faidz.fun;

    ssl_certificate     /etc/letsencrypt/live/cloud.faidz.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.faidz.fun/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # 1 MB, not 500 MB. The API accepts JSON only; raising this would not enable
    # larger uploads, it would only widen what a bad request can cost.
    client_max_body_size 1m;

    # No access log for share links: the token in the path is a bearer
    # credential, and the application already redacts it in its own log.
    location /s/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nothing the API returns is cacheable, and a cached session response
        # would be served to the wrong person.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    root /var/www/cloud;
    index index.html;

    # Hashed asset filenames change whenever their content does, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # old bundle and asking for asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Single-page app: every other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
